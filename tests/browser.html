<!doctype html>
<!--
  Browser tests: start a web server at the repository top and open /tests/browser.html.
    python3 -m http.server   →  http://localhost:8000/tests/browser.html
  Opens the decks in iframes and checks slide counts, notes, outside requests, fonts and error screens, and also reopens E-key pack results.
  The "bundled" rows open tests/out/ made by node --test (run it first; skipped if missing).
  Results go in the table and window.testResults (title is PASS when all pass).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>tests</title>
<style>
  :root { color-scheme: light dark; --ok: #2e9e5b; --bad: #d64545; --skip: #999; }
  body { font: 14px/1.5 system-ui, sans-serif; margin: 24px; }
  table { border-collapse: collapse; width: 100%; }
  td, th { border-bottom: 1px solid #8884; padding: 4px 8px; text-align: left; vertical-align: top; }
  td.r { font-weight: 600; } .ok { color: var(--ok); } .bad { color: var(--bad); } .skip { color: var(--skip); }
  code { font-size: 12px; }
  #stage { position: absolute; left: -20000px; top: 0; }
  #stage iframe { width: 1280px; height: 720px; border: 0; }
</style>
</head>
<body>
<h1>deckmd browser tests</h1>
<p id="sum">running…</p>
<table><thead><tr><th>Result</th><th>What</th><th>URL</th><th>Seen</th></tr></thead><tbody id="rows"></tbody></table>
<div id="stage"></div>
<script>
const R = '../';          // repository top
const OUT = 'out/';       // node --test output

// tests/fixtures/parse: --- and Note: inside code blocks stay body text; everything below the first Note: is notes
function parseCheck(d) {
  const s = d.querySelector('.slides > section');
  const body = [...s.children].filter(c => c.tagName !== 'ASIDE').map(c => c.textContent).join(' ');
  const notes = s.querySelector('aside.notes')?.textContent || '';
  if (!/inside-code/.test(body) || !/after-code/.test(body)) return `body: ${body}`;
  if (!/note-one/.test(notes) || !/Note:/.test(notes) || !/note-two/.test(notes)) return `notes: ${notes}`;
  return true;
}

// DeckMD.slides(): where each slide is in the Markdown file. expected = [[startLine, endLine, notes?], …] in slide order
function slidesCheck(expected) {
  return (d) => {
    const DM = d.defaultView.DeckMD;
    const got = DM.slides();
    const lines = DM.source.split(/\r?\n/);
    const range = JSON.stringify(got.map(s => [s.startLine, s.endLine]));
    if (range !== JSON.stringify(expected.map(e => [e[0], e[1]]))) return `ranges: ${range}`;
    for (const [i, s] of got.entries()) {
      if (s.source !== lines.slice(s.startLine - 1, s.endLine).join('\n')) return `slide ${i + 1}: source is not the file's lines`;
      if (expected[i][2] != null && s.notes !== expected[i][2]) return `slide ${i + 1}: notes ${JSON.stringify(s.notes)}`;
    }
    return true;
  };
}

// DeckMD.setSource / outline / slideAt / currentSlide on tests/fixtures/lines/talk.md (slides at lines 5-10, 14-24, 29-29)
const ranges = (list) => JSON.stringify(list.map(s => [s.startLine, s.endLine]));
function setSourceCheck(d) {
  const DM = d.defaultView.DeckMD, t0 = DM.source, lines0 = t0.split('\n');
  // the shown slides must agree with what outline() says about the same text
  const agree = (what) => { const got = ranges(DM.slides()), want = ranges(DM.outline(DM.source).slides); return got === want || `${what}: shown ${got}, outline ${want}`; };
  const expect = (what, want) => ranges(DM.slides()) === JSON.stringify(want) || `${what}: ${ranges(DM.slides())}`;
  let r = DM.setSource(t0.replace('## Two', '## Two edited'));
  if (!r.ok || r.slides !== 3 || !DM.slides()[1].source.includes('## Two edited') || DM.source === t0) return `edit: ${JSON.stringify(r)}`;
  let a = agree('edit'); if (a !== true) return a;
  r = DM.setSource(t0.replace('---\n\n## Two', '---\n\n## Inserted\n\n---\n\n## Two'));               // a slide inserted before Two
  if (!r.ok || r.slides !== 4) return `insert: ${JSON.stringify(r)}`;
  if ((a = agree('insert')) !== true || (a = expect('insert', [[5, 10], [14, 14], [18, 28], [33, 33]])) !== true) return a;
  if (DM.slides()[2].source.split('\n')[0] !== '## Two' || DM.slides()[2].notes !== 'say two') return 'insert: the moved slide lost its source or notes';
  const cut = lines0.slice(0); cut.splice(13, 11);                                                    // Two (lines 14-24) deleted
  r = DM.setSource(cut.join('\n'));
  if (!r.ok || r.slides !== 2) return `delete: ${JSON.stringify(r)}`;
  if ((a = agree('delete')) !== true || (a = expect('delete', [[5, 10], [18, 18]])) !== true) return a;
  r = DM.setSource(t0);                                                                               // and back
  if (!r.ok || r.slides !== 3 || DM.source !== t0 || (a = expect('back', [[5, 10], [14, 24], [29, 29]])) !== true) return `back: ${JSON.stringify(r)}`;
  return true;
}
function setSourcePositionCheck(d) {
  const DM = d.defaultView.DeckMD, R = d.defaultView.Reveal, t0 = DM.source;
  R.slide(1);
  if (R.getIndices().h !== 1) return 'could not move to slide 2';
  if (!DM.setSource(`${t0}\n`).ok || R.getIndices().h !== 1) return `the slide shown moved: ${R.getIndices().h}`;
  if (!DM.setSource(t0, { line: 29 }).ok || R.getIndices().h !== 2) return `line 29 should show slide 3: ${R.getIndices().h}`;
  if (!DM.setSource(t0, { line: 7 }).ok || R.getIndices().h !== 0) return `line 7 should show slide 1: ${R.getIndices().h}`;
  R.slide(2);
  if (!DM.setSource(t0.replace('## Three', '')).ok || R.getIndices().h !== 1) return `with a slide fewer, the last one should stay: ${R.getIndices().h}`;
  return true;
}
function setSourceRefuseCheck(d) {
  const DM = d.defaultView.DeckMD, t0 = DM.source, n = DM.slides().length;
  let r = DM.setSource(t0.replace('title: lines test', 'title: changed'));
  if (r.ok || !r.reload || DM.source !== t0 || DM.slides().length !== n) return `front matter change: ${JSON.stringify(r)}`;
  r = DM.setSource('---\ntitle: [\n---\n\n## x\n');
  if (r.ok || r.reload || !/YAML/.test(r.error) || DM.source !== t0 || DM.slides().length !== n) return `YAML error: ${JSON.stringify(r)}`;
  const o = DM.outline('---\ntitle: [\n---\n\n## x\n');
  if (o.ok || !/YAML/.test(o.error)) return `outline of a YAML error: ${JSON.stringify(o)}`;
  if (DM.slides().length !== n) return 'the deck changed';
  return true;
}
function outlineCheck(d) {
  const DM = d.defaultView.DeckMD, o = DM.outline(DM.source);
  if (!o.ok || o.meta.title !== 'lines test' || o.split !== 'rules' || !o.frontMatter.startsWith('---') || !o.frontMatter.includes('title: lines test')) return `meta: ${JSON.stringify(o).slice(0, 200)}`;
  if (ranges(o.slides) !== '[[5,10],[14,24],[29,29]]') return `ranges: ${ranges(o.slides)}`;
  if (o.slides[0].attrs.class !== 'center' || Object.keys(o.slides[1].attrs).length) return `attrs: ${JSON.stringify(o.slides.map(x => x.attrs))}`;
  return true;
}
function slideAtCheck(d) {
  const DM = d.defaultView.DeckMD;                                       // slides at 5-10, 14-24, 29-29
  const want = { 1: 5, 3: 5, 5: 5, 7: 5, 10: 5, 11: 14, 12: 14, 13: 14, 14: 14, 24: 14, 25: 29, 28: 29, 29: 29, 99: 29 };
  for (const [line, start] of Object.entries(want)) if (DM.slideAt(Number(line))?.startLine !== start) return `line ${line} → ${DM.slideAt(Number(line))?.startLine}, want ${start}`;
  return true;
}
// With the source plugin: its slides and its front matter page survive a render, and currentSlide() maps a source slide back to its slide
function sourcePluginRenderCheck(d) {
  const DM = d.defaultView.DeckMD, R = d.defaultView.Reveal;
  const state = () => `${d.querySelectorAll('.source-slide').length}/${d.querySelectorAll('.source-slide.front-matter').length}/${DM.slides().length}`;
  const before = state();
  if (!DM.setSource(`${DM.source}\n`).ok) return 'setSource failed';
  if (state() !== before) return `source slides: ${before} → ${state()}`;
  if (!DM.setSource(DM.source).ok || state() !== before) return `source slides after a second render: ${state()}`;
  R.slide(0, 1);
  if (!R.getCurrentSlide().classList.contains('source-slide')) return 'could not move to a source slide';
  if (DM.currentSlide() !== DM.slides()[0]) return `currentSlide on a source slide: ${DM.currentSlide()?.startLine}`;
  R.slide(1, 0);
  if (DM.currentSlide() !== DM.slides()[1]) return 'currentSlide on a slide';
  return true;
}
// beforeRender / afterRender are called on every render; the <style>s moved out of slides don't pile up
function renderHooksCheck(d) {
  const DM = d.defaultView.DeckMD, log = d.defaultView.__renderLog;
  const afters = () => log.filter(x => x.startsWith('after:')).length;
  if (log[0] !== 'before:false' || afters() !== 3) return `load: ${log.join()}`;
  const styles = () => [...d.querySelectorAll('body > style')].filter(x => /render-test/.test(x.textContent)).length;
  if (styles() !== 1) return `the slide's <style> should be moved to the body once: ${styles()}`;
  for (let i = 0; i < 3; i++) if (!DM.setSource(`${DM.source}\n`).ok) return `setSource ${i + 1} failed`;
  if (log.filter(x => x.startsWith('before')).join() !== 'before:false,before:true,before:true,before:true') return `beforeRender: ${log.join()}`;
  if (afters() !== 12) return `afterRender should run for every slide on every render: ${afters()}`;
  if (styles() !== 1) return `moved <style>s piled up: ${styles()}`;
  return true;
}

// Review of #17: what setSource / slideAt / outline do with bad input and with a plugin that throws
function rollbackCheck(d) {
  const DM = d.defaultView.DeckMD, R = d.defaultView.Reveal, t0 = DM.source;
  const before = DM.slides().map(s => s.section), styles = () => [...d.querySelectorAll('body > style')].filter(x => /render-test/.test(x.textContent)).length;
  R.slide(1);
  const r = DM.setSource(t0.replace('## Three', '## BOOM'));
  if (r.ok || r.reload || !/boom/.test(r.error)) return `a throwing plugin: ${JSON.stringify(r)}`;
  if (DM.source !== t0) return 'DeckMD.source changed although it failed';
  const now = DM.slides().map(s => s.section);
  if (now.length !== before.length || now.some((x, i) => x !== before[i])) return 'the slides are not the ones that were shown before';
  if (R.getIndices().h !== 1) return `the position moved: ${R.getIndices().h}`;
  if (styles() !== 1) return `the moved <style> is gone or doubled: ${styles()}`;
  if (!DM.setSource(`${t0}\n`).ok || DM.slides().length !== 3) return 'a good text after a failed one should work';
  return true;
}
function badInputCheck(d) {
  const DM = d.defaultView.DeckMD, t0 = DM.source;
  for (const bad of ['abc', NaN, null, undefined, '', Infinity]) if (DM.slideAt(bad) !== null) return `slideAt(${String(bad)}) should be null: ${DM.slideAt(bad)?.startLine}`;
  if (DM.slideAt('29')?.startLine !== 29) return 'slideAt("29") should work (a numeric string)';
  for (const bad of [undefined, null, 123, {}]) {
    if (DM.setSource(bad).ok) return `setSource(${JSON.stringify(bad)}) should fail`;
    if (DM.outline(bad).ok) return `outline(${JSON.stringify(bad)}) should fail`;
  }
  if (!DM.setSource(t0, null).ok) return 'setSource(text, null) should work';
  if (!DM.setSource(t0, { line: 'abc' }).ok) return 'setSource(text, { line: "abc" }) should work (the line is ignored)';
  if (DM.source !== t0 || DM.slides().length !== 3) return 'the deck changed';
  return true;
}
// An editor (CodeMirror) keeps lines as \n whatever the file had: the same text with \r\n is the same deck
function crlfCheck(d) {
  const DM = d.defaultView.DeckMD, t0 = DM.source, crlf = t0.replace(/\n/g, '\r\n');
  const want = '[[5,10],[14,24],[29,29]]';
  if (ranges(DM.outline(crlf).slides) !== want) return `outline: ${ranges(DM.outline(crlf).slides)}`;
  const r = DM.setSource(crlf);
  if (!r.ok) return `setSource: ${JSON.stringify(r)}`;
  if (ranges(DM.slides()) !== want) return `ranges: ${ranges(DM.slides())}`;
  if (/\r/.test(DM.slides()[1].source) || DM.slides()[1].notes !== 'say two') return 'source or notes have \\r in them';
  return true;
}

// Deck list: view and &core links for each example deck. Checks for the decks that should be there, not a count (so adding examples doesn't break it)
const LIST_DECKS = ['grid/talk.md', 'interactive/talk.md', 'math/talk.md', 'readme/rewrite.md', 'syntax/talk.md'];
const mathCheck = d => {                                       // the math fixture: 3 formulas drawn (inline + block on slide 1, \(…\) on slide 3), 1 broken one in place
  const slides = d.querySelector('.slides').textContent;
  return (d.querySelectorAll('.slides .katex').length === 3 && d.querySelectorAll('.slides .math-error').length === 1 && slides.includes('costs $5 and $10') && slides.includes('$x$ in a code block') && slides.includes('a_b c_d stay text'))
    || `katex ${d.querySelectorAll('.slides .katex').length} · errors ${d.querySelectorAll('.slides .math-error').length}`;
};
function listCheck(d) {
  const hrefs = [...d.querySelectorAll('.deck-list a')].map(a => decodeURIComponent(a.getAttribute('href')));
  const missing = LIST_DECKS.filter(f => !hrefs.includes(`?src=examples/${f}`) || !hrefs.includes(`?src=examples/${f}&core`));
  if (missing.length) return `missing from list: ${missing.join(', ')}`;
  // the two READMEs are listed after the scan, open with the source plugin added (?use=source), and have no short version (core: false: no &core link)
  const bad = ['README.md', 'README.ko.md'].filter(f => !hrefs.includes(`?src=${f}&use=source`) || hrefs.some(h => h.startsWith(`?src=${f}`) && h.endsWith('&core')));
  return !bad.length || `README entries wrong in the list: ${bad.join(', ')}`;
}

// Checks: slides and notes are counts, ext = number of outside requests (0 = offline), text = text that must be on screen, check = other checks
const CASES = [
  { group: 'view', name: 'example grid', url: `${R}?src=examples/grid/talk.md`, slides: 11, notes: 2, font: true },
  { group: 'view', name: 'example syntax', url: `${R}?src=examples/syntax/talk.md`, slides: 11, notes: 2 },
  { group: 'view', name: 'deck written in HTML', url: `${R}examples/page/`, slides: 3, notes: 1 },
  { group: 'view', name: 'deck list', url: R, check: listCheck },
  { group: 'view', name: '?pick comes before the list', url: `${R}?pick`, check: d => (!!d.querySelector('.deck-open') && !d.querySelector('.deck-list')) || 'file picker screen' },
  { group: 'syntax', name: '--- and Note: inside code blocks', url: `${R}?src=tests/fixtures/parse/talk.md`, slides: 4, notes: 1, check: parseCheck },
  { group: 'syntax', name: 'split by headings', url: `${R}?src=tests/fixtures/headings/talk.md`, slides: 3, text: ['horizontal rule inside code'] },
  { group: 'syntax', name: '?core (defaultTier: core = slides without a tier stay)', url: `${R}?src=tests/fixtures/tiers/talk.md&core`, slides: 4 },
  { group: 'syntax', name: '?core + defaultTier=none (core slides only)', url: `${R}?src=tests/fixtures/tiers/talk.md&core&defaultTier=none`, slides: 2 },
  { group: 'syntax', name: '?core with no core slides shows all', url: `${R}?src=examples/grid/talk.md&core&defaultTier=none`, slides: 11 },
  // DeckMD.slides(): the lines of each slide in the Markdown file (an editor jumps between the deck and the file with these)
  { group: 'slide info', name: '--- slides: line ranges and notes (a Note: or --- inside a code block is not a split; a blank slide is skipped)', url: `${R}?src=tests/fixtures/lines/talk.md`, slides: 3, check: slidesCheck([[5, 10, 'say one'], [14, 24, 'say two'], [29, 29, '']]) },
  { group: 'slide info', name: 'lazy: source and notes are getters, and slides() hands out the slideInfo objects themselves (nothing is copied or read)', url: `${R}?src=tests/fixtures/lines/talk.md`, slides: 3, check: d => {
      const DM = d.defaultView.DeckMD, S = DM.slides();
      if (!S.length) return 'no slides';
      for (const k of ['source', 'notes']) if (typeof Object.getOwnPropertyDescriptor(S[0], k)?.get !== 'function') return `${k} is not a getter`;
      if (S.some(i => i !== DM.slideInfo.get(i.section))) return 'slides() copies the info objects';
      return true; } },
  { group: 'slide info', name: 'split by headings: a slide covers its heading and the blocks under it', url: `${R}?src=tests/fixtures/lines/readme.md`, slides: 4, check: slidesCheck([[1, 3], [5, 8], [10, 12], [14, 20]]) },
  { group: 'slide info', name: 'split by headings, lines=2: continued slides start at their first block', url: `${R}?src=tests/fixtures/lines/readme.md&lines=2`, slides: 7, check: slidesCheck([[1, 1], [3, 3], [5, 8], [10, 12], [14, 16], [18, 18], [20, 20]]) },
  { group: 'slide info', name: 'with the source plugin: only the real slides, not the source slides', url: `${R}?src=tests/fixtures/source/talk.md`, slides: 3, check: d => slidesCheck([[6, 11], [15, 19], [23, 25]])(d) === true && !d.defaultView.DeckMD.slides().some(s => s.section.classList.contains('source-slide')) || 'source slides are listed' },
  { group: 'slide info', name: '?core: a cut slide is gone from the list', url: `${R}?src=tests/fixtures/source/talk.md&core&defaultTier=none`, slides: 1, check: slidesCheck([[23, 25]]) },
  // DeckMD.setSource / outline / slideAt / currentSlide / beforeRender: what an editor needs
  { group: 'set source', name: 'setSource: edit, insert and delete a slide, and back (the shown slides agree with outline(), notes and source move along)', url: `${R}?src=tests/fixtures/lines/talk.md`, slides: 3, check: setSourceCheck },
  { group: 'set source', name: 'setSource keeps the slide shown, or shows the one at opts.line; with a slide fewer it stays on the last', url: `${R}?src=tests/fixtures/lines/talk.md`, slides: 3, check: setSourcePositionCheck },
  { group: 'set source', name: 'setSource refuses a changed front matter ({ reload: true }) and a YAML error, and changes nothing', url: `${R}?src=tests/fixtures/lines/talk.md`, slides: 3, check: setSourceRefuseCheck },
  { group: 'set source', name: 'outline(text): the slide ranges and settings of a text without showing it', url: `${R}?src=tests/fixtures/lines/talk.md`, slides: 3, check: outlineCheck },
  { group: 'set source', name: 'slideAt(line): the slide containing the line, else the next one (the last after the end)', url: `${R}?src=tests/fixtures/lines/talk.md`, slides: 3, check: slideAtCheck },
  { group: 'set source', name: 'with the source plugin: source slides and the front matter page survive a render; currentSlide() on a source slide', url: `${R}?src=tests/fixtures/source/talk.md`, slides: 3, check: sourcePluginRenderCheck },
  { group: 'set source', name: '?core: a cut slide stays cut after setSource', url: `${R}?src=tests/fixtures/source/talk.md&core&defaultTier=none`, slides: 1, check: d => d.defaultView.DeckMD.setSource(d.defaultView.DeckMD.source).ok && d.defaultView.DeckMD.slides().length === 1 && ranges(d.defaultView.DeckMD.slides()) === '[[23,25]]' || '?core after setSource' },
  { group: 'set source', name: 'beforeRender/afterRender on every render, and moved <style>s do not pile up', url: `${R}?src=tests/fixtures/render/talk.md`, slides: 3, check: renderHooksCheck },
  // Review of #17
  { group: 'set source', name: 'a plugin that throws while the slides are built again: nothing changes (source, slides, position, moved <style>)', url: `${R}?src=tests/fixtures/render/talk.md`, slides: 3, check: rollbackCheck },
  { group: 'set source', name: 'bad input: slideAt(not a number) is null, setSource/outline of a non-string fail, opts may be null', url: `${R}?src=tests/fixtures/lines/talk.md`, slides: 3, check: badInputCheck },
  { group: 'set source', name: 'the same text with \\r\\n (an editor keeps \\n) is the same deck: no spurious reload', url: `${R}?src=tests/fixtures/lines/talk.md`, slides: 3, check: crlfCheck },
  { group: 'source', name: 'plugins: [source] → source slides under each slide, the front matter first under slide 1 (not under <!-- source: off -->; notes stay out, tags stay text, highlighted)', url: `${R}?src=tests/fixtures/source/talk.md`, slides: 3, notes: 1, check: d => {
      const src = [...d.querySelectorAll('.slides > section > section.source-slide code')].map(c => c.textContent);
      return (src.length === 3 && src[0].includes('title: source plugin test') && src[1].includes('# One') && src[1].includes('<b>tags</b>') && !src[1].includes('speaker note') && src[2].includes('tier: core') && !d.querySelector('.source-slide b') && d.querySelectorAll('.slides .source-slide code.hljs').length === 3)
        || `source slides: ${JSON.stringify(src)}`; } },
  { group: 'source', name: '?source=off hides them (the plugin stays loaded)', url: `${R}?src=tests/fixtures/source/talk.md&source=off`, slides: 3, check: d => d.querySelectorAll('.slides .source-slide').length === 0 || 'a source slide is there' },
  { group: 'source', name: '?core: a cut slide takes its source with it', url: `${R}?src=tests/fixtures/source/talk.md&core&defaultTier=none`, slides: 1, check: d => d.querySelectorAll('.slides .source-slide').length === 2 || 'source slides after ?core (front matter + source of the one left)' },
  { group: 'view', name: 'README.md is a deck: no slide breaks, split by headings; ?use=source adds a source slide under each slide', url: `${R}?src=README.md&use=source`, check: d => {
      const top = d.querySelectorAll('.slides > section').length, withSource = d.querySelectorAll('.slides > section > section.source-slide').length;
      return (top >= 10 && withSource === top && d.querySelector('.slides h1')?.textContent.trim() === 'deckmd') || `slides ${top} · with a source slide ${withSource}`; } },
  { group: 'view', name: '?use=source on a deck that already lists the source plugin: loaded once (one source slide per slide, not two)', url: `${R}?src=examples/grid/talk.md&use=source`, slides: 11, check: d =>
      (d.querySelectorAll('.slides > section > section.source-slide').length === 12 && d.defaultView.DeckMD.loaded.filter(r => /plugins\/source\/source\.js$/.test(r.key)).length === 1)           // 11 slides: the front matter page makes 12
      || `source slides ${d.querySelectorAll('.slides > section > section.source-slide').length}` },
  { group: 'view', name: '?use= takes only the names of built-in plugins: a path, a URL or a dotted name is ignored', url: `${R}?src=tests/fixtures/headings/talk.md&use=../x,https://example.invalid/p.js,/etc/p,a.b,Source`, slides: 3, check: d =>
      (!d.defaultView.DeckMD.loaded.some(r => /example\.invalid|\/x\b|etc\/p|a\.b|plugins\/source/.test(r.key)) && !d.defaultView.performance.getEntriesByType('resource').some(e => /example\.invalid/.test(e.name)))
      || `loaded ${d.defaultView.DeckMD.loaded.map(r => r.key).join(', ')}` },
  { group: 'view', name: 'example math', url: `${R}?src=examples/math/talk.md`, slides: 5, check: d => (d.querySelectorAll('.slides .katex').length === 6 && d.querySelectorAll('.slides .math-error').length === 1) || 'formulas / errors in the math example' },
  { group: 'math', name: 'plugins: [math] → formulas are drawn; money, escapes and code stay text; a mistake stays in place', url: `${R}?src=tests/fixtures/math/talk.md`, slides: 3, check: mathCheck },

const stage = document.getElementById('stage');
const sleep = ms => new Promise(r => setTimeout(r, ms));

// Open one iframe and wait for the deck to be fully up (or the error, list or picker screen)
async function load(src, srcdoc) {
  const f = document.createElement('iframe');
  if (srcdoc != null) f.srcdoc = srcdoc; else f.src = src;
  stage.appendChild(f);
  const t0 = Date.now();
  for (;;) {
    await sleep(100);
    const w = f.contentWindow, d = f.contentDocument;
    const settled = d && (w.Reveal?.isReady?.() || d.querySelector('.deck-list, .deck-open') || /Can't open the deck/.test(d.body?.textContent || ''));
    if (settled) { await w.document.fonts?.ready; await sleep(300); return f; }
    if (Date.now() - t0 > 10000) return f;
  }
}

function measure(f) {
  const w = f.contentWindow, d = f.contentDocument;
  const res = w.performance.getEntriesByType('resource').map(e => e.name).filter(u => !/^(data|blob):/.test(u));
  return {
    slides: d.querySelectorAll('.reveal .slides > section').length,
    notes: d.querySelectorAll('aside.notes').length,
    ext: res.filter(u => !u.startsWith(location.origin)).length,
    font: w.document.fonts.check('16px "Pretendard Variable"') && [...w.document.fonts].some(x => x.family.replace(/"/g, '') === 'Pretendard Variable' && x.status === 'loaded'),
    text: (d.querySelector('.reveal .slides') || d.body)?.textContent || '',   // text drawn on screen (excluding the embedded Markdown source)
  };
}

function judge(c, m, d) {
  const why = [];
  for (const k of ['slides', 'notes', 'ext']) if (c[k] != null && m[k] !== c[k]) why.push(`${k} ${m[k]} (expected ${c[k]})`);
  if (c.font && !m.font) why.push('font not loaded');
  for (const t of c.text || []) if (!m.text.includes(t)) why.push(`"${t}" missing`);
  if (c.check) { const r = c.check(d); if (r !== true) why.push(r || 'check'); }
  return why;
}

async function exists(url) { try { return (await fetch(url, { method: 'HEAD' })).ok; } catch { return false; } }

const results = window.testResults = [];
function row(c, status, seen) {
  results.push({ group: c.group, name: c.name, status, seen });
  const tr = document.createElement('tr');
  tr.innerHTML = `<td class="r ${status}">${{ ok: 'pass', bad: 'fail', skip: 'skipped' }[status]}</td><td>${c.group} · ${c.name}</td><td><a href="${c.url}" target="_blank"><code>${c.url}</code></a>${c.pack ? ` → E key ${c.pack}` : ''}</td><td>${seen}</td>`;
  document.getElementById('rows').appendChild(tr);
}

(async () => {
  // Refetch the cache so the changed code is tested right away (the iframes use the cache)
  for (const f of ['js/boot.js', 'js/defaults.js', 'js/deck.js', 'js/notices.js', 'js/pack.js', 'js/md-spans.js', 'css/base.css', 'themes/ember/ember.css', 'plugins/grid/grid.js', 'plugins/grid/grid.css', 'deck.config.js']) {
    await fetch(R + f, { cache: 'reload' }).catch(() => {});
  }
  for (const c of CASES) {
    try {
      if (c.built && !(await exists(c.url))) { row(c, 'skip', 'run node --test first'); continue; }
      let f = await load(c.url);
      let extra = '';
      if (c.pack) {
        const { html, missing } = await f.contentWindow.DeckPack.pack(c.pack, () => {});
        f.remove();
        extra = ` · ${Math.round(html.length / 1024)} KB${missing.length ? ` · not embedded ${missing.join(', ')}` : ''}`;
        f = await load(null, html);
      }
      const m = measure(f);
      const why = judge(c, m, f.contentDocument);
      f.remove();
      row(c, why.length ? 'bad' : 'ok', (why.join(' · ') || `slides ${m.slides} · notes ${m.notes} · outside requests ${m.ext}${c.font ? ' · font' : ''}`) + extra);
    } catch (e) { row(c, 'bad', String(e)); }
  }
  const n = s => results.filter(r => r.status === s).length;
  document.getElementById('sum').textContent = `pass ${n('ok')} · fail ${n('bad')} · skipped ${n('skip')}`;
  document.title = n('bad') ? 'FAIL' : 'PASS';
  document.body.dataset.done = '1';
})();
