<!doctype html>
<!--
  The same launcher page as templates/index.html, with every tag written out instead of boot.js (assumes deckmd is in the repository's deckmd/ folder).
  Order matters: deck.config.js → reveal → Markdown libraries → defaults.js → notices.js, pack.js → deck.js (the order of the list in js/boot.js).
  To work offline, download with node deckmd/tools/localize.mjs, then change https:// to deckmd/vendor/
  (https://cdn.jsdelivr.net/npm/… → deckmd/vendor/cdn.jsdelivr.net/npm/…).
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>deck</title>
  <script src="deck.config.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@6.0.2/dist/reset.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@6.0.2/dist/reveal.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
</head>
<body>
  <div class="reveal"><div class="slides"></div></div>

  <script src="https://cdn.jsdelivr.net/npm/reveal.js@6.0.2/dist/reveal.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/reveal.js@6.0.2/dist/plugin/notes.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/reveal.js@6.0.2/dist/plugin/highlight.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/markdown-it@15.0.2/dist/browser/markdown-it.umd.min.js"></script>
  <script src="deckmd/js/md-spans.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/markdown-it-attrs@5.0.1/markdown-it-attrs.browser.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/markdown-it-container@4.0.0/dist/markdown-it-container.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/js-yaml@5.4.3/dist/browser/js-yaml.umd.min.js"></script>
  <script src="deckmd/js/defaults.js"></script>
  <script src="deckmd/js/notices.js"></script>
  <script src="deckmd/js/pack.js"></script>
  <script src="deckmd/js/deck.js"></script>
</body>
</html>
